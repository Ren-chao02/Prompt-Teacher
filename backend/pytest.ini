[tool:pytest]
DJANGO_SETTINGS_MODULE = prompt_teaching.settings
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 测试发现路径
testpaths = tests

# 标记（markers）
markers =
    unit: 单元测试
    integration: 集成测试
    api: API测试
    slow: 耗时较长的测试

# 选项
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=users,learning,practice,notifications,analytics
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=70

# Django相关配置
django_debug_mode = true

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
