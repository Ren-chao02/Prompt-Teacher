<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00A4F4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0089CC;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="50" cy="50" r="45" fill="url(#grad1)" opacity="0.1"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#grad1)" stroke-width="2"/>
  
  <!-- 书本图标 -->
  <path d="M30 35 L50 30 L70 35 L70 65 L50 60 L30 65 Z" fill="url(#grad1)" opacity="0.9"/>
  <line x1="50" y1="30" x2="50" y2="60" stroke="white" stroke-width="2"/>
  
  <!-- 文字线条 -->
  <line x1="35" y1="42" x2="45" y2="40" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="35" y1="47" x2="45" y2="45" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="55" y1="42" x2="65" y2="40" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="55" y1="47" x2="65" y2="45" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
</svg>
