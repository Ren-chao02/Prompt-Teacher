upstream backend {
    server backend:8001;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    # 关键：关闭绝对重定向，使 301 等返回相对路径 Location，
    # 避免用容器内监听端口 80 构造 URL 而丢失宿主机映射端口（如 8081）
    absolute_redirect off;

    # Vue 管理后台 SPA（最长前缀优先匹配，不走后端）
    location /admin/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /admin/index.html;
    }

    # 学生前台及所有非 /admin/ 路径转发给 Django 后端渲染
    # （/、/learning/、/practice/、/users/ 等由 Django core/learning/practice app 处理）
    # 注意：用 $http_host 而非 $host，保留宿主机映射端口（如 8081），
    # 使 Django 看到的 Host 与浏览器 Origin 一致，避免 Session 表单登录 403 CSRF
    location / {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # API 代理
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Django 原生 Admin
    location /django-admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态文件
    location /static/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
    }

    # 媒体文件
    location /media/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
    }

    # WebSocket 支持
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
}
